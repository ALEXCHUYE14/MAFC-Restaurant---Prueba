name: CI — build y tests de humo

# ══════════════════════════════════════════════════════════════════
# Corre en cada push/PR a main: build de producción (atrapa errores de
# sintaxis/import) + tests de humo con Playwright contra ese mismo build
# (atrapa una pantalla rota en cualquiera de las 5 rutas). No requiere
# ningún secreto — no toca Supabase real, solo sirve dist/ localmente.
# ══════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-system
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pos-system/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        run: npm run build

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests de humo
        run: npm run test:e2e

      - name: Subir reporte de Playwright (si falló algo)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: pos-system/playwright-report/
          retention-days: 14
