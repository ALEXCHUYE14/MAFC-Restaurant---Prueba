<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF8F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110F" media="(prefers-color-scheme: dark)">
<meta name="description" content="Carta digital: platos, bebidas y tragos con precios actualizados.">
<title>Carta Digital</title>
<link rel="icon" href="/img/logo/Antojitos.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   CARTA DIGITAL — página pública, solo lectura.
   Estética editorial: marfil cálido + carbón + acento ámbar.
   Tokens con modo oscuro automático (preferencia del teléfono).
═══════════════════════════════════════════════════════════════ */
:root {
  --bg:        #FBF8F3;
  --bg-2:      #F4EFE7;
  --card:      #FFFFFF;
  --ink:       #1C1917;
  --ink-2:     #44403C;
  --muted:     #78716C;
  --line:      #E9E2D6;
  --line-2:    #DDD3C4;
  --accent:    #B45309;
  --accent-2:  #D97706;
  --accent-bg: #FEF3E2;
  --danger:    #B91C1C;
  --danger-bg: #FEE2E2;
  --ok:        #15803D;
  --shadow:    0 1px 2px rgba(28,25,23,.04), 0 8px 24px rgba(28,25,23,.06);
  --shadow-lg: 0 -8px 40px rgba(28,25,23,.18);
  --serif:     'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:      'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:         18px;
  --ease:      cubic-bezier(.22,1,.36,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #14110F;
    --bg-2:      #1C1815;
    --card:      #1F1B18;
    --ink:       #F5F0E8;
    --ink-2:     #D6CFC4;
    --muted:     #A8A097;
    --line:      #2E2823;
    --line-2:    #3A332C;
    --accent:    #F59E0B;
    --accent-2:  #FBBF24;
    --accent-bg: rgba(245,158,11,.12);
    --danger:    #F87171;
    --danger-bg: rgba(248,113,113,.12);
    --ok:        #4ADE80;
    --shadow:    0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --shadow-lg: 0 -8px 40px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; min-height: 100vh;
  overflow-x: hidden;
}
body.lock { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
img { display: block; max-width: 100%; }
svg { flex-shrink: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }

/* ── Hero ─────────────────────────────────────────── */
.hero {
  position: relative; text-align: center;
  padding: calc(36px + env(safe-area-inset-top)) 16px 28px;
  background:
    radial-gradient(120% 80% at 50% 0%, var(--accent-bg) 0%, transparent 60%),
    var(--bg);
  border-bottom: 1px solid var(--line);
}
.hero-logo {
  width: 84px; height: 84px; margin: 0 auto 14px; border-radius: 50%;
  background: var(--card); border: 1px solid var(--line);
  box-shadow: var(--shadow); padding: 8px; object-fit: contain;
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 8px;
}
.hero-name {
  font-family: var(--serif); font-weight: 700;
  font-size: clamp(28px, 7vw, 44px); line-height: 1.08; letter-spacing: -.01em;
  overflow-wrap: anywhere; max-width: 720px; margin: 0 auto;
}
.hero-addr {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
  font-size: 13px; color: var(--muted); max-width: 100%;
}
.hero-addr span { overflow-wrap: anywhere; }

/* ── Barra fija: búsqueda + categorías ────────────── */
.bar {
  position: sticky; top: 0; z-index: 30;
  background: var(--bg); /* respaldo para navegadores sin color-mix */
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(160%) blur(14px); backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
}
.search {
  display: flex; align-items: center; gap: 10px;
  margin: 12px 0 10px; padding: 0 14px; height: 46px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  color: var(--muted); transition: border-color .2s;
}
.search:focus-within { border-color: var(--accent); }
.search input {
  flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent;
  font: inherit; font-size: 16px; color: var(--ink);
}
.search input::placeholder { color: var(--muted); }
.search-clear { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: var(--muted); }
.search-clear:hover { background: var(--bg-2); }

.chips {
  display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 12px; margin: 0 -16px;
  scrollbar-width: none; scroll-snap-type: x proximity;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0;
  height: 38px; padding: 0 14px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--line);
  font-size: 13.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap;
  transition: background .2s, color .2s, border-color .2s; scroll-snap-align: start;
}
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ── Secciones ────────────────────────────────────── */
main { padding: 8px 0 140px; }
.section { padding-top: 26px; scroll-margin-top: 130px; }
.section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.section-icon {
  display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px;
  background: var(--accent-bg); color: var(--accent);
}
.section-title { font-family: var(--serif); font-weight: 600; font-size: 24px; line-height: 1.1; overflow-wrap: anywhere; }
.section-count { font-size: 12px; color: var(--muted); margin-top: 2px; }
.section-rule { flex: 1; height: 1px; background: var(--line); margin-left: 4px; }

.grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 720px) { .grid { grid-template-columns: 1fr 1fr; gap: 14px; } }

.item {
  display: flex; gap: 14px; align-items: stretch; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 12px; box-shadow: var(--shadow);
  transition: transform .25s var(--ease), border-color .2s;
}
.item:active { transform: scale(.985); }
@media (hover: hover) { .item:hover { border-color: var(--line-2); transform: translateY(-2px); } }
.item.off { opacity: .62; }
.item-body { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 2px 0; }
.item-name { font-weight: 600; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
.item-desc {
  font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.item-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 10px; }
.price { font-weight: 700; font-size: 16px; color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 999px;
}
.badge.out { background: var(--danger-bg); color: var(--danger); }
.badge.qty { background: var(--accent-bg); color: var(--accent); }
.thumb {
  position: relative; width: 104px; height: 104px; flex-shrink: 0; border-radius: 14px; overflow: hidden;
  background: var(--bg-2); display: grid; place-items: center; color: var(--muted);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.item.off .thumb img { filter: grayscale(.8); }
.thumb-add {
  position: absolute; right: 6px; bottom: 6px; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; background: var(--card); color: var(--ink);
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}

/* ── Estados ──────────────────────────────────────── */
.state { text-align: center; padding: 64px 24px; color: var(--muted); }
.state-icon { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 20px; background: var(--bg-2); color: var(--muted); }
.state h2 { font-family: var(--serif); font-weight: 600; font-size: 21px; color: var(--ink); margin-bottom: 6px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 48px; padding: 0 20px; border-radius: 14px; font-weight: 600; font-size: 15px;
  transition: transform .15s, opacity .2s;
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--ink); color: var(--bg); }
.btn-accent { background: var(--accent); color: #fff; }
.btn-ghost { background: var(--bg-2); color: var(--ink); }
.btn-block { width: 100%; }
.skel { background: linear-gradient(90deg, var(--bg-2) 25%, var(--line) 50%, var(--bg-2) 75%); background-size: 200% 100%; animation: sh 1.3s infinite linear; border-radius: 10px; }
@keyframes sh { to { background-position: -200% 0; } }

.notice {
  display: flex; gap: 10px; align-items: flex-start; margin-top: 18px; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: 14px; background: var(--card);
  font-size: 12.5px; color: var(--muted);
}

/* ── Barra flotante "Mi selección" ───────────────── */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  pointer-events: none;
}
.dock-btn {
  pointer-events: auto; max-width: 560px; margin: 0 auto; width: 100%;
  display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 8px 0 18px;
  background: var(--ink); color: var(--bg); border-radius: 18px;
  box-shadow: 0 12px 32px rgba(0,0,0,.28);
  animation: up .35s var(--ease) both;
}
.dock-count {
  display: grid; place-items: center; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 999px;
  background: var(--accent-2); color: #1C1917; font-size: 13px; font-weight: 700;
}
.dock-label { flex: 1; text-align: left; font-weight: 600; }
.dock-total { font-weight: 700; font-variant-numeric: tabular-nums; padding: 0 12px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: rgba(255,255,255,.1); }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ── Hoja inferior (detalle / selección) ─────────── */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(12,10,9,.55); animation: fade .25s ease both; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
  max-height: 92vh; display: flex; flex-direction: column;
  background: var(--card); border-radius: 24px 24px 0 0; box-shadow: var(--shadow-lg);
  animation: sheetUp .38s var(--ease) both;
  max-width: 640px; margin: 0 auto;
}
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
.sheet-grip { width: 40px; height: 4px; border-radius: 4px; background: var(--line-2); margin: 10px auto 0; flex-shrink: 0; }
.sheet-close {
  position: absolute; top: 14px; right: 14px; z-index: 2; width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center; background: var(--card);
  background: color-mix(in srgb, var(--card) 85%, transparent);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 2px 10px rgba(0,0,0,.15);
}
.sheet-scroll { overflow-y: auto; overscroll-behavior: contain; flex: 1; }
.sheet-img { width: calc(100% - 32px); margin: 14px 16px 0; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 18px; background: var(--bg-2); }
.sheet-img-ph { display: grid; place-items: center; color: var(--muted); }
.sheet-pad { padding: 18px 20px 8px; }
.sheet-cat { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.sheet-title { font-family: var(--serif); font-weight: 600; font-size: 26px; line-height: 1.15; margin-top: 4px; overflow-wrap: anywhere; }
.sheet-desc { color: var(--ink-2); margin-top: 10px; font-size: 15px; white-space: pre-line; overflow-wrap: anywhere; }
.sheet-price { font-size: 22px; font-weight: 700; color: var(--accent); margin-top: 14px; font-variant-numeric: tabular-nums; }
.sheet-foot {
  display: flex; gap: 12px; align-items: center; padding: 14px 20px calc(16px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line); flex-shrink: 0;
}
.stepper { display: flex; align-items: center; height: 48px; border: 1px solid var(--line); border-radius: 14px; flex-shrink: 0; }
.stepper button { width: 44px; height: 100%; display: grid; place-items: center; color: var(--ink); }
.stepper button[disabled] { color: var(--line-2); cursor: not-allowed; }
.stepper span { min-width: 28px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.sheet-h { font-family: var(--serif); font-weight: 600; font-size: 24px; padding: 18px 20px 4px; }
.sheet-sub { padding: 0 20px 10px; font-size: 13px; color: var(--muted); }

.sel-row { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--line); }
.sel-row:first-child { border-top: 0; }
.sel-img { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; background: var(--bg-2); flex-shrink: 0; display: grid; place-items: center; color: var(--muted); }
.sel-info { flex: 1; min-width: 0; }
.sel-name { font-weight: 600; overflow-wrap: anywhere; line-height: 1.25; }
.sel-price { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sel-row .stepper { height: 40px; }
.sel-row .stepper button { width: 36px; }
.sel-total { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 20px; border-top: 1px solid var(--line); font-weight: 600; }
.sel-total strong { font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }

/* ── Vista "Mostrar al mesero" (pantalla completa) ── */
.show {
  position: fixed; inset: 0; z-index: 60; background: var(--bg); overflow-y: auto;
  padding: calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
  animation: fade .2s ease both;
}
.show-inner { max-width: 560px; margin: 0 auto; }
.show-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.show-title { font-family: var(--serif); font-weight: 700; font-size: 28px; line-height: 1.1; }
.show-list { border-top: 2px solid var(--ink); }
.show-row { display: flex; gap: 14px; align-items: baseline; padding: 16px 0; border-bottom: 1px dashed var(--line-2); font-size: 20px; }
.show-qty { font-weight: 700; color: var(--accent); min-width: 44px; font-variant-numeric: tabular-nums; }
.show-name { flex: 1; font-weight: 600; overflow-wrap: anywhere; line-height: 1.25; }
.show-sub { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 16px; white-space: nowrap; }
.show-total { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 0 6px; font-size: 18px; font-weight: 600; }
.show-total strong { font-size: 30px; color: var(--accent); font-variant-numeric: tabular-nums; }

.qr-box { text-align: center; margin: 4px 0 22px; }
.qr-frame {
  width: min(300px, 78vw); aspect-ratio: 1; margin: 0 auto; padding: 10px;
  background: #FFFFFF; border-radius: 20px; border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.qr-frame img { width: 100%; height: 100%; image-rendering: pixelated; }
.qr-cap { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.qr-warn { margin-top: 8px; font-size: 12.5px; color: var(--danger); }

.toast {
  position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); z-index: 70;
  transform: translateX(-50%); width: min(520px, calc(100% - 32px));
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 12px 12px 14px;
  background: var(--ink); color: var(--bg); border-radius: 14px; font-size: 13.5px; line-height: 1.4;
  box-shadow: 0 12px 32px rgba(0,0,0,.28); animation: drop .3s var(--ease) both;
}
.toast span { flex: 1; overflow-wrap: anywhere; }
.toast button { color: inherit; opacity: .7; display: grid; place-items: center; }
@keyframes drop { from { transform: translate(-50%, -12px); opacity: 0; } }

footer.site { text-align: center; padding: 28px 16px 8px; color: var(--muted); font-size: 12.5px; }
footer.site strong { color: var(--ink-2); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src-apps/carta/main.jsx"></script>
</body>
</html>
