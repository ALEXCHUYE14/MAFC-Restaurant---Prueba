<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF8F3">
<title>Encuesta de satisfacción</title>
<link rel="icon" href="/favicon.ico" />
<style>
:root {
  --bg: #FBF8F3; --card: #FFFFFF; --ink: #1C1917; --muted: #78716C; --line: #E9E2D6;
  --accent: #B45309; --accent-2: #D97706; --ok: #15803D; --err: #B91C1C;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14110F; --card: #1E1A17; --ink: #F5F0E8; --muted: #A8A29E; --line: #3A332D; --accent: #F59E0B; --accent-2: #FBBF24; --ok: #4ADE80; --err: #F87171; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px 20px; text-align: center; }
h1 { font-size: 22px; margin: 4px 0 6px; }
p { color: var(--muted); font-size: 14.5px; line-height: 1.5; margin: 0 0 14px; }
.stars { display: flex; justify-content: center; gap: 6px; margin: 10px 0 16px; }
.stars button { background: none; border: none; font-size: 40px; line-height: 1; cursor: pointer; color: var(--line); padding: 2px; }
.stars button.on { color: var(--accent-2); }
.stars button:focus-visible { outline: 2px solid var(--accent); border-radius: 8px; }
textarea { width: 100%; min-height: 90px; resize: vertical; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 15px; background: var(--bg); color: var(--ink); }
.send { margin-top: 14px; width: 100%; padding: 13px; border: none; border-radius: 12px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
.send:disabled { opacity: .55; cursor: not-allowed; }
.msg { font-size: 14px; margin-top: 10px; }
.err { color: var(--err); }
.ok { color: var(--ok); font-size: 18px; font-weight: 700; }
small { display: block; color: var(--muted); font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src-apps/encuesta/main.jsx"></script>
</body>
</html>
